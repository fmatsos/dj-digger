[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-digger"
version = "0.1.0"
description = "Catalog and export DJ music libraries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.15,<1.0"]

[project.scripts]
dj-digger = "dj_digger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_digger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
