[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-digger"
version = "0.1.0"
description = "Catalog and export DJ music libraries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15,<1.0",
    "rich>=14,<16",
    "jsonschema>=4.25,<5",
    "numpy>=2,<3",
]

[project.optional-dependencies]
analysis = ["essentia==2.1b6.dev1389"]

[project.scripts]
dj-digger = "dj_digger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_digger"]

[tool.hatch.build.targets.wheel.force-include]
"schema-bundle.json" = "dj_digger/schema-bundle.json"
"config/analysis.toml" = "dj_digger/analysis.toml"
"schemas/tracks.schema.json" = "dj_digger/schemas/tracks.schema.json"
"schemas/library-artifacts.schema.json" = "dj_digger/schemas/library-artifacts.schema.json"
"schemas/snapshot-manifest.schema.json" = "dj_digger/schemas/snapshot-manifest.schema.json"
"schemas/dj-analysis.schema.json" = "dj_digger/schemas/dj-analysis.schema.json"
"schemas/dj-sections.schema.json" = "dj_digger/schemas/dj-sections.schema.json"
"schemas/dj-analysis-run.schema.json" = "dj_digger/schemas/dj-analysis-run.schema.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
