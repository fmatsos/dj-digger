[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-digger"
version = "0.1.0"
description = "Catalog and export DJ music libraries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15,<1.0",
    "rich>=14,<16",
    "jsonschema>=4.25,<5",
    "numpy>=2,<3",
    "essentia==2.1b6.dev1389",
    "mcp>=2,<3",
    "pydantic>=2.11,<3",
    "sqlite-utils>=3.35,<4",
]

[project.scripts]
dj-digger = "dj_digger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_digger"]

[tool.hatch.build.targets.wheel.force-include]
"schema-bundle.json" = "dj_digger/schema-bundle.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.17,<2",
    "pytest>=8,<9",
    "pyright>=1.1.411",
    "ruff>=0.12,<1",
]
