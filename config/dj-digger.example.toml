[workspace]
database = "/workspace/dj-digger.sqlite"
exports = "/workspace/exports"

[curation]
base_url = "https://api.openai.com/v1"
endpoint = "chat/completions"
model = "gpt-5-mini"
reasoning_effort = "none"
api_key_env = "OPENAI_API_KEY"
request_timeout_seconds = 30
total_timeout_seconds = 120
max_turns = 8
max_output_tokens = 2000
max_output_tracks = 20

[[library.sources]]
id = "neon-archive"
path = "/music/neon-archive"
set_eligible = true
analyze = true
enabled = true

[[library.sources]]
id = "lunar-radio"
path = "/music/lunar-radio"
set_eligible = false
analyze = false
enabled = true
