version: 15

models:
  luna_low:
    provider: chatgpt
    model: gpt-5.6-luna
    thinking_budget: low

  sol_medium:
    provider: chatgpt
    model: gpt-5.6-sol
    thinking_budget: medium

agents:
  lead:
    model: luna_low
    description: Classify and orchestrate bounded DJ Digger tasks
    instruction_file: .docker-agent/instructions/lead.md
  codex-worker:
    description: Bounded Luna-medium Codex implementation worker
    harness:
      type: codex
      model: gpt-5.6-luna
  reviewer:
    model: sol_medium
    description: Fresh Sol-medium read-only risk reviewer for elevated-risk changes
    instruction_file: .docker-agent/instructions/reviewer.md
