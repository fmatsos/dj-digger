name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync development environment
        run: uv sync --frozen --group dev

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Check types
        run: uv run mypy src

      - name: Check types with pyright
        run: uv run pyright --pythonpath .venv/bin/python src

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync development environment
        run: uv sync --frozen --group dev

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg libimage-exiftool-perl libchromaprint-tools rsync

      - name: Run tests
        run: uv run --with "pytest-cov>=6,<8" pytest --cov=dj_digger --cov-report=term-missing --cov-fail-under=85

      - name: Run native runtime smoke
        run: ./.codex/cloud/check.sh --runtime

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync development environment
        run: uv sync --frozen --group dev

      - name: Install package-check runtime dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libimage-exiftool-perl

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify installed wheel through uvx
        run: ./.agents/scripts/package-check
