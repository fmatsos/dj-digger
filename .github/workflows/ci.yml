name: CI

on:
  push:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Sync development environment
        run: uv sync --frozen --group dev

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Check types
        run: uv run mypy src

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Sync development environment
        run: uv sync --frozen --group dev

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg libimage-exiftool-perl libchromaprint-tools

      - name: Run tests
        run: uv run pytest -q

      - name: Run native runtime smoke
        run: ./.codex/cloud/check.sh --runtime

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Sync development environment
        run: uv sync --frozen --group dev

      - name: Install package-check runtime dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libimage-exiftool-perl

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify installed wheel through uvx
        run: ./.agents/scripts/package-check
