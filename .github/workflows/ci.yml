name: CI

on:
  push:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Check lint
        run: uv run --frozen --with ruff ruff check .

      - name: Check formatting
        run: uv run --frozen --with ruff ruff format --check src tests

      - name: Check types
        run: uv run --frozen --with mypy mypy src

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg libimage-exiftool-perl

      - name: Run tests
        run: uv run --frozen --with pytest pytest -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"

      - name: Build wheel and source distribution
        run: uv build
